# 发布工作流:在打 tag 或手动触发时构建 musl 二进制并发布 GitHub Release。
name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  # 默认只读:构建/校验 job 会执行依赖构建脚本与 pnpm install,不应持有写权限。
  # 只有最终的发布 job 单独申请 contents: write。
  contents: read

env:
  # 兼容"tag 推送触发"与"手动指定 tag"两种入口。
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    # 先对将要发布的 tag 做完整校验;任何失败都会阻止后续 release。
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nodelite-server/web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: nodelite-server/web
        run: pnpm install --frozen-lockfile

      # 以下前端门禁与 ci.yml 的 Web Lint and Test 保持一致,任一失败都阻止发布。
      - name: Audit web dependencies
        working-directory: nodelite-server/web
        run: pnpm audit --audit-level high

      - name: Lint web
        working-directory: nodelite-server/web
        run: pnpm lint

      - name: Type-check web
        working-directory: nodelite-server/web
        run: pnpm typecheck

      - name: Unit test web
        working-directory: nodelite-server/web
        run: pnpm test

      - name: Build web assets
        working-directory: nodelite-server/web
        run: pnpm build

      - name: Guard against bulk inline scripts (CSP)
        working-directory: nodelite-server/web
        run: |
          if perl -ne 'BEGIN{$/=undef} exit 1 if /<script>[^<]{800,}/' dist/index.html; then
            echo "inline-script guard: ok"
          else
            echo "::error::dist/index.html contains an inline <script> longer than 800 chars"
            exit 1
          fi

      - name: Set up Rust
        # 发布前和 CI 一样要求 rustfmt / clippy 都通过。
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: release-validate
          workspaces: |
            . -> target

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install cargo-audit
        uses: taiki-e/install-action@51b65422b7953c6b71a6f15b2ba16135551ce70a # cargo-audit
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@51b65422b7953c6b71a6f15b2ba16135551ce70a # cargo-deny
        with:
          tool: cargo-deny

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        env:
          NODELITE_SKIP_WEB_BUILD: 1
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        env:
          NODELITE_SKIP_WEB_BUILD: 1
        run: cargo test --workspace --locked

      - name: Shellcheck installers
        run: shellcheck scripts/install-server.sh scripts/install-server-config.sh scripts/install-server-upgrade.sh scripts/install-agent.sh scripts/install-agent-signed.sh scripts/test-install-agent.sh scripts/server-web-update.sh scripts/merge-release-checksums.sh scripts/test-install-server-summary.sh scripts/test-install-server-modules.sh scripts/test-install-server-config.sh scripts/test-server-web-update.sh scripts/test-release-checksums.sh scripts/check-demo-credentials.sh scripts/check-actions-pinned.sh

      - name: Test Agent installer
        run: sudo sh scripts/test-install-agent.sh

      - name: Test signing and enrollment tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/nodelite-operator-tests"
          "$RUNNER_TEMP/nodelite-operator-tests/bin/pip" install --only-binary=:all: -r tools/nodelite_release/requirements.txt
          "$RUNNER_TEMP/nodelite-operator-tests/bin/python" -m unittest discover -s tools -t . -v

      - name: Test server config templates
        run: sh scripts/test-install-server-config.sh

      - name: Test version-bound installer helpers
        run: sh scripts/test-install-server-modules.sh

      - name: Test transactional server upgrades
        run: python3 scripts/test-install-server-upgrade.py

      - name: Test server upgrade recovery with real systemd units
        run: sudo python3 scripts/test-install-server-upgrade.py --systemd crash not_ready wrong_version success migrate_fail corrupt_backup restore_fail signal

      - name: Test verified web update bootstrap
        run: sh scripts/test-server-web-update.sh

      - name: Test release checksum manifest
        run: sh scripts/test-release-checksums.sh

      - name: Audit dependency advisories
        run: cargo audit --deny warnings

      - name: Check dependency policy
        run: cargo deny check

  build-linux:
    # 针对 x86_64 / aarch64 两个 musl 目标分别构建。
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Check out repository
        # fetch-depth=0 让 cross 等工具能看到完整历史;ref 强制 checkout 到 release tag。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nodelite-server/web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: nodelite-server/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            . -> target

      - name: Install cross
        uses: taiki-e/install-action@51b65422b7953c6b71a6f15b2ba16135551ce70a # cross
        with:
          tool: cross

      - name: Warm cross image with retries
        # GHCR 偶发超时会让 cross 首次拉镜像失败;先显式重试拉取,减少 release 偶发红灯。
        run: |
          cross_version="$(cross --version | awk 'NR==1 {print $2}')"
          image="ghcr.io/cross-rs/${{ matrix.target }}:${cross_version}"
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "failed to pull $image after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Disable local linker overrides for CI cross build
        # 与 CI 工作流相同:暂时挪开本地的 linker 配置,避免与 cross 容器冲突。
        run: |
          if [ -f .cargo/config.toml ]; then
            mv .cargo/config.toml .cargo/config.toml.ci-bak
          fi

      - name: Build release server binary
        # 通过 NODELITE_BUILD_VERSION 把 tag 注入二进制,便于运行时打印版本号。
        # NODELITE_SKIP_WEB_BUILD=1 因为前端资源已在前面步骤构建完成。
        run: |
          NODELITE_BUILD_VERSION="${RELEASE_TAG#v}" \
          NODELITE_SKIP_WEB_BUILD=1 \
          cross build --locked --release --target "${{ matrix.target }}" \
            -p nodelite-server

      - name: Build release agent binary
        # 单独构建 agent 以确保其 tokio features 不被 server 的 full 污染。
        run: |
          NODELITE_BUILD_VERSION="${RELEASE_TAG#v}" \
          cross build --locked --release --target "${{ matrix.target }}" \
            -p nodelite-agent

      - name: Collect release assets
        # 把构建产物拷贝到 dist/ 并生成对应的 SHA256 校验文件。
        run: |
          cross build --locked --release --target "${{ matrix.target }}" -p nodelite-updater
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/nodelite-server" "dist/nodelite-server-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/nodelite-agent" "dist/nodelite-agent-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/nodelite-updater" "dist/nodelite-updater-${{ matrix.target }}"
          sha256sum \
            "dist/nodelite-server-${{ matrix.target }}" \
            "dist/nodelite-agent-${{ matrix.target }}" \
            "dist/nodelite-updater-${{ matrix.target }}" \
            > "dist/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/nodelite-server-${{ matrix.target }}
            dist/nodelite-agent-${{ matrix.target }}
            dist/nodelite-updater-${{ matrix.target }}
            dist/SHA256SUMS-${{ matrix.target }}.txt

      - name: Upload installer scripts
        # 安装脚本只需要随某一个架构上传一次。
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scripts
          path: |
            scripts/install-server.sh
            scripts/install-server-config.sh
            scripts/install-server-upgrade.sh
            scripts/install-agent.sh
            scripts/install-agent-signed.sh
            scripts/merge-release-checksums.sh

  build-agent-macos:
    # 先只发布 Agent 的 macOS 二进制,server 仍保持 Linux 官方发布范围。
    name: Build agent ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: release-agent-macos-${{ matrix.target }}
          workspaces: |
            . -> target

      - name: Build release agent binary
        run: |
          NODELITE_BUILD_VERSION="${RELEASE_TAG#v}" \
          cargo build --locked --release --target "${{ matrix.target }}" -p nodelite-agent

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/nodelite-agent" "dist/nodelite-agent-${{ matrix.target }}"
          shasum -a 256 \
            "dist/nodelite-agent-${{ matrix.target }}" \
            > "dist/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent-${{ matrix.target }}
          path: |
            dist/nodelite-agent-${{ matrix.target }}
            dist/SHA256SUMS-${{ matrix.target }}.txt

  sbom:
    # 生成 workspace 级 CycloneDX SBOM,随 Release 一起发布。
    name: Generate SBOM
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: release-sbom
          workspaces: |
            . -> target

      - name: Install cargo-cyclonedx
        # 固定 cargo-cyclonedx 版本,避免 release 产物随工具默认行为漂移。
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --target all \
            --all \
            --all-features
          cp nodelite-proto/nodelite-proto.cdx.json dist/
          cp nodelite-agent/nodelite-agent.cdx.json dist/
          cp nodelite-server/nodelite-server.cdx.json dist/
          cp nodelite-updater/nodelite-updater.cdx.json dist/
          cp THIRD_PARTY_NOTICES.md dist/
          sha256sum dist/*.cdx.json dist/THIRD_PARTY_NOTICES.md > dist/SHA256SUMS-sbom.txt

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: |
            dist/nodelite-proto.cdx.json
            dist/nodelite-agent.cdx.json
            dist/nodelite-server.cdx.json
            dist/nodelite-updater.cdx.json
            dist/THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS-sbom.txt

  release:
    # 汇总产物 → 合并校验文件 → 写入 GitHub Release。
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-agent-macos
      - sbom
    runs-on: ubuntu-latest
    permissions:
      # 仅此 job 需要创建 Release 并上传资产。
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets

      - name: Merge checksums
        # 对即将上传的 installer 本体取摘要,再与二进制/SBOM 摘要合并。
        run: sh release-assets/release-scripts/merge-release-checksums.sh release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          release_flags=()
          if [[ "$TAG_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if ! gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GH_REPO" \
              --title "NodeLite $TAG_NAME" \
              --generate-notes \
              "${release_flags[@]}"
          elif [[ "$TAG_NAME" == *-* ]]; then
            gh release edit "$TAG_NAME" \
              --repo "$GH_REPO" \
              --prerelease
          fi

          gh release upload "$TAG_NAME" \
            --repo "$GH_REPO" \
            release-assets/release-x86_64-unknown-linux-musl/nodelite-server-x86_64-unknown-linux-musl \
            release-assets/release-x86_64-unknown-linux-musl/nodelite-agent-x86_64-unknown-linux-musl \
            release-assets/release-x86_64-unknown-linux-musl/nodelite-updater-x86_64-unknown-linux-musl \
            release-assets/release-aarch64-unknown-linux-musl/nodelite-server-aarch64-unknown-linux-musl \
            release-assets/release-aarch64-unknown-linux-musl/nodelite-agent-aarch64-unknown-linux-musl \
            release-assets/release-aarch64-unknown-linux-musl/nodelite-updater-aarch64-unknown-linux-musl \
            release-assets/release-agent-x86_64-apple-darwin/nodelite-agent-x86_64-apple-darwin \
            release-assets/release-agent-aarch64-apple-darwin/nodelite-agent-aarch64-apple-darwin \
            release-assets/release-scripts/install-server.sh \
            release-assets/release-scripts/install-server-config.sh \
            release-assets/release-scripts/install-server-upgrade.sh \
            release-assets/release-scripts/install-agent.sh \
            release-assets/release-scripts/install-agent-signed.sh \
            release-assets/release-sbom/nodelite-proto.cdx.json \
            release-assets/release-sbom/nodelite-agent.cdx.json \
            release-assets/release-sbom/nodelite-server.cdx.json \
            release-assets/release-sbom/nodelite-updater.cdx.json \
            release-assets/release-sbom/THIRD_PARTY_NOTICES.md \
            release-assets/SHA256SUMS.txt \
            --clobber
