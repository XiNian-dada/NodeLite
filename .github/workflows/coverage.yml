# 覆盖率工作流:在 main 推送和 PR 时生成测试覆盖率报告。
# 独立于主 CI 流程,避免拖慢 lint-and-test 的反馈速度。
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-build:
    name: Build Web Assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodelite-server/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: nodelite-server/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload web dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-coverage
          path: nodelite-server/web/dist
          retention-days: 1

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [web-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-coverage
          path: nodelite-server/web/dist

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: ci-coverage-llvm
          workspaces: |
            . -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@51b65422b7953c6b71a6f15b2ba16135551ce70a # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Run coverage
        env:
          NODELITE_SKIP_WEB_BUILD: 1
          # Preserve the existing coverage-only fixture timeouts without changing the tests.
          RUSTFLAGS: --cfg=tarpaulin
        run: |
          cargo llvm-cov --workspace --locked --no-report
          mkdir -p target/coverage
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml --fail-under-lines 75 --ignore-filename-regex 'nodelite-server/src/(load_test|test_support)\.rs'
          cargo llvm-cov report --html --output-dir target/coverage --ignore-filename-regex 'nodelite-server/src/(load_test|test_support)\.rs'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/cobertura.xml
          fail_ci_if_error: false

      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 14
