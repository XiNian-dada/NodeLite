[package]
name = "nodelite-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "nodelite_agent"
path = "src/lib.rs"

[[bin]]
name = "nodelite-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
clap.workspace = true
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom.workspace = true
libc.workspace = true
rustls.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "sync", "signal", "fs", "process"] }
# Supply current roots explicitly instead of the upstream webpki-roots 0.26 adapter.
tokio-tungstenite = { workspace = true, features = ["__rustls-tls"] }
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "tracing-log"] }
thiserror.workspace = true
url.workspace = true
webpki-roots.workspace = true
nodelite-proto = { path = "../nodelite-proto", default-features = false, features = ["wire-compression"] }

[dev-dependencies]
openssl.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
