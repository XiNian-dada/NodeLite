# Agent 配置示例。各字段语义见 nodelite-proto/src/config.rs 中的 AgentConfig。

[agent]
# 节点唯一标识(ASCII 字母/数字/-_.,最长 128 字符),用于 Server 端识别和路由。
node_id = "hk-01"
# 节点展示名,显示在前端列表与详情页。
node_label = "Hong Kong 01"
# Server WebSocket 接入点,生产环境必须使用 wss://。
server = "wss://monitor.example.com/ws"
# 由 Server 通过 `install-agent` 等命令颁发的长期 token,与 node_id 配对使用。
token = "issued-by-nodelite-server"
# 上报间隔(秒),决定前端最快多久能看到一次刷新。
report_interval_secs = 5
# 可选:覆盖 /proc/sys/kernel/hostname,适用于容器或匿名化部署。
hostname_override = "hk-01.internal"
# 可选:节点标签,前端可据此分组过滤。
tags = ["apac", "edge"]
# 会话期限单位均为秒，允许 1..=3600；超时后关闭连接并退避重试。
# Agent 连接超时。
connect_timeout_secs = 20
# Upgrade 成功后等待认证响应的期限；Ping 不会延长此期限。
auth_timeout_secs = 20
# 单次 WebSocket 发送及 flush 的期限。
send_timeout_secs = 20
# 认证后最长入站静默。建议至少为 Server ping_interval_secs 的三倍。
inbound_timeout_secs = 90
# Agent 最大接收消息字节数。
max_incoming_message_bytes = 65536
# 不安全传输警告间隔(秒)。
insecure_transport_warn_interval_secs = 900
