name: Release
'on':
  push:
    tags:
    - '*.*.*'
    - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || forgejo.ref_name }}
  NODELITE_BUILD_TAG: ${{ inputs.tag || forgejo.ref_name }}
  CARGO_BUILD_JOBS: '2'
  CI: 'true'
jobs:
  validate:
    name: Validate release tag
    runs-on: mainland
    steps:
    - name: Check provisioned build tools
      working-directory: .
      run: |
        node --version
        pnpm --version
        rustup --version
        python3 -c "import yaml"
        command -v tini
    - name: Bind provenance to the release tag
      env:
        SOURCE_REF: ${{ forgejo.ref }}
      run: |
        if [ "$SOURCE_REF" != "refs/tags/$RELEASE_TAG" ]; then
          echo "::error::Run this workflow from the release tag (workflow_dispatch --ref must match input tag)"
          exit 1
        fi
    - name: Fetch exact source archive
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_COMMIT: ${{ forgejo.sha }}
        ARCHIVE_PROXY: ${{ vars.SOURCE_ARCHIVE_PROXY }}
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE"
        printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | \
          curl -q --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 180 --retry 2 --retry-delay 3 --retry-connrefused \
          --config - --proxy "$ARCHIVE_PROXY" --noproxy '' \
          --output "$RUNNER_TEMP/source.tar.gz" \
          "$SOURCE_SERVER/api/v1/repos/$SOURCE_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
        tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
    - name: Install web dependencies
      working-directory: nodelite-server/web
      run: pnpm install --frozen-lockfile
    - name: Audit web dependencies
      working-directory: nodelite-server/web
      run: pnpm audit --registry=https://registry.npmjs.org --audit-level high
    - name: Lint web
      working-directory: nodelite-server/web
      run: pnpm lint
    - name: Type-check web
      working-directory: nodelite-server/web
      run: pnpm typecheck
    - name: Unit test web
      working-directory: nodelite-server/web
      run: pnpm test
    - name: Build web assets
      working-directory: nodelite-server/web
      run: pnpm build
    - name: Guard against bulk inline scripts (CSP)
      working-directory: nodelite-server/web
      run: |
        if perl -ne 'BEGIN{$/=undef} exit 1 if /<script>[^<]{800,}/' dist/index.html; then
          echo "inline-script guard: ok"
        else
          echo "::error::dist/index.html contains an inline <script> longer than 800 chars"
          exit 1
        fi
    - name: Set up Rust
      run: |
        rustup default 1.93.1
        rustup component add clippy rustfmt
    - name: Cache Cargo dependencies and build outputs
      uses: https://data.forgejo.org/actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092
      with:
        path: |
          /usr/local/cargo/registry
          /usr/local/cargo/git
          target
          fuzz/target
        key: nodelite-release-validate-native-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-audit
      run: cargo install cargo-audit --version 0.22.2 --locked
    - name: Install cargo-deny
      run: cargo install cargo-deny --version 0.20.2 --locked
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Run clippy
      env:
        NODELITE_SKIP_WEB_BUILD: 1
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - name: Run tests
      env:
        NODELITE_SKIP_WEB_BUILD: 1
      run: tini -s -- cargo test --workspace --locked
    - name: Shellcheck installers
      run: shellcheck scripts/install-server.sh scripts/install-server-config.sh scripts/install-server-upgrade.sh
        scripts/install-agent.sh scripts/install-agent-signed.sh scripts/test-install-agent.sh scripts/server-web-update.sh
        scripts/merge-release-checksums.sh scripts/test-install-server-summary.sh scripts/test-install-server-modules.sh
        scripts/test-install-server-config.sh scripts/test-server-web-update.sh scripts/test-release-checksums.sh
        scripts/check-demo-credentials.sh scripts/check-actions-pinned.sh
    - name: Test Agent installer
      run: |
        sh scripts/test-install-agent.sh
        python3 scripts/test-agent-enrollment-pins.py -v
        python3 scripts/test-installer-versions.py -v
    - name: Test signing and enrollment tooling
      run: |
        python3 -m venv "$RUNNER_TEMP/nodelite-operator-tests"
        "$RUNNER_TEMP/nodelite-operator-tests/bin/pip" install --only-binary=:all: -r tools/nodelite_release/requirements.txt
        "$RUNNER_TEMP/nodelite-operator-tests/bin/python" -m unittest discover -s tools -t . -v
    - name: Test server config templates
      run: sh scripts/test-install-server-config.sh
    - name: Test version-bound installer helpers
      run: sh scripts/test-install-server-modules.sh
    - name: Test transactional server upgrades
      run: python3 scripts/test-install-server-upgrade.py
    - name: Test verified web update bootstrap
      run: sh scripts/test-server-web-update.sh
    - name: Test release checksums and publisher
      run: |
        sh scripts/test-release-checksums.sh
        python3 scripts/test-forgejo-release.py
    - name: Audit dependency advisories
      run: cargo audit --deny warnings
    - name: Check dependency policy
      run: cargo deny check
    container:
      image: nodelite-ci:20261113-v2
    timeout-minutes: 120
  build-linux:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: mainland
    strategy:
      fail-fast: false
      matrix:
        target:
        - x86_64-unknown-linux-musl
        - aarch64-unknown-linux-musl
      max-parallel: 1
    steps:
    - name: Check provisioned build tools
      working-directory: .
      run: |
        node --version
        pnpm --version
        rustup --version
        python3 -c "import yaml"
        command -v tini
    - name: Fetch exact source archive
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_COMMIT: ${{ forgejo.sha }}
        ARCHIVE_PROXY: ${{ vars.SOURCE_ARCHIVE_PROXY }}
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE"
        printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | \
          curl -q --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 180 --retry 2 --retry-delay 3 --retry-connrefused \
          --config - --proxy "$ARCHIVE_PROXY" --noproxy '' \
          --output "$RUNNER_TEMP/source.tar.gz" \
          "$SOURCE_SERVER/api/v1/repos/$SOURCE_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
        tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
    - name: Build web assets
      working-directory: nodelite-server/web
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    - name: Set up Rust
      run: |
        rustup default 1.93.1
    - name: Cache Cargo dependencies and build outputs
      uses: https://data.forgejo.org/actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092
      with:
        path: |
          /usr/local/cargo/registry
          /usr/local/cargo/git
          target
          fuzz/target
        key: nodelite-release-build-linux-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
    - name: Install pinned musl cross toolchain
      run: |
        python3 -m venv "$RUNNER_TEMP/zig"
        "$RUNNER_TEMP/zig/bin/pip" install --only-binary=:all: ziglang==0.13.0
        printf '%s\n' "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
        cargo install cargo-zigbuild --version 0.24.1 --locked
        rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
    - name: Disable local linker overrides for CI cross build
      run: |
        if [ -f .cargo/config.toml ]; then
          mv .cargo/config.toml .cargo/config.toml.ci-bak
        fi
    - name: Build release server binary
      run: |
        NODELITE_BUILD_VERSION="${RELEASE_TAG#v}" \
        NODELITE_SKIP_WEB_BUILD=1 \
        cargo zigbuild --locked --release --target "${{ matrix.target }}" \
          -p nodelite-server
    - name: Build release agent binary
      run: |
        NODELITE_BUILD_VERSION="${RELEASE_TAG#v}" \
        cargo zigbuild --locked --release --target "${{ matrix.target }}" \
          -p nodelite-agent
    - name: Collect release assets
      run: |
        NODELITE_BUILD_VERSION="${RELEASE_TAG#v}" cargo zigbuild --locked --release --target "${{ matrix.target }}" -p nodelite-updater
        mkdir -p dist
        cp "target/${{ matrix.target }}/release/nodelite-server" "dist/nodelite-server-${{ matrix.target }}"
        cp "target/${{ matrix.target }}/release/nodelite-agent" "dist/nodelite-agent-${{ matrix.target }}"
        cp "target/${{ matrix.target }}/release/nodelite-updater" "dist/nodelite-updater-${{ matrix.target }}"
        sha256sum \
          "dist/nodelite-server-${{ matrix.target }}" \
          "dist/nodelite-agent-${{ matrix.target }}" \
          "dist/nodelite-updater-${{ matrix.target }}" \
          > "dist/SHA256SUMS-${{ matrix.target }}.txt"
    - name: Upload build artifacts
      uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
      with:
        name: release-${{ matrix.target }}
        path: |
          dist/nodelite-server-${{ matrix.target }}
          dist/nodelite-agent-${{ matrix.target }}
          dist/nodelite-updater-${{ matrix.target }}
          dist/SHA256SUMS-${{ matrix.target }}.txt
    - name: Upload installer scripts
      if: matrix.target == 'x86_64-unknown-linux-musl'
      uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
      with:
        name: release-scripts
        path: |
          scripts/install-server.sh
          scripts/install-server-config.sh
          scripts/install-server-upgrade.sh
          scripts/install-agent.sh
          scripts/install-agent-signed.sh
          scripts/merge-release-checksums.sh
    container:
      image: nodelite-ci:20261113-v2
    timeout-minutes: 120
  sbom:
    name: Generate SBOM
    needs: validate
    runs-on: mainland
    steps:
    - name: Check provisioned build tools
      working-directory: .
      run: |
        node --version
        pnpm --version
        rustup --version
        python3 -c "import yaml"
        command -v tini
    - name: Fetch exact source archive
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_COMMIT: ${{ forgejo.sha }}
        ARCHIVE_PROXY: ${{ vars.SOURCE_ARCHIVE_PROXY }}
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE"
        printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | \
          curl -q --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 180 --retry 2 --retry-delay 3 --retry-connrefused \
          --config - --proxy "$ARCHIVE_PROXY" --noproxy '' \
          --output "$RUNNER_TEMP/source.tar.gz" \
          "$SOURCE_SERVER/api/v1/repos/$SOURCE_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
        tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
    - name: Set up Rust
      run: |
        rustup default 1.93.1
    - name: Cache Cargo dependencies and build outputs
      uses: https://data.forgejo.org/actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092
      with:
        path: |
          /usr/local/cargo/registry
          /usr/local/cargo/git
          target
          fuzz/target
        key: nodelite-release-sbom-native-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-cyclonedx
      run: cargo install cargo-cyclonedx --version 0.5.9 --locked
    - name: Generate CycloneDX SBOM
      run: |
        mkdir -p dist
        cargo cyclonedx \
          --format json \
          --spec-version 1.5 \
          --target all \
          --all \
          --all-features
        cp nodelite-proto/nodelite-proto.cdx.json dist/
        cp nodelite-agent/nodelite-agent.cdx.json dist/
        cp nodelite-server/nodelite-server.cdx.json dist/
        cp nodelite-updater/nodelite-updater.cdx.json dist/
        cp THIRD_PARTY_NOTICES.md dist/
        sha256sum dist/*.cdx.json dist/THIRD_PARTY_NOTICES.md > dist/SHA256SUMS-sbom.txt
    - name: Upload SBOM artifact
      uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
      with:
        name: release-sbom
        path: |
          dist/nodelite-proto.cdx.json
          dist/nodelite-agent.cdx.json
          dist/nodelite-server.cdx.json
          dist/nodelite-updater.cdx.json
          dist/THIRD_PARTY_NOTICES.md
          dist/SHA256SUMS-sbom.txt
    container:
      image: nodelite-ci:20261113-v2
    timeout-minutes: 120
  release:
    name: Publish Forgejo Release
    needs:
    - build-linux
    - sbom
    - build-agent-macos
    runs-on: mainland
    steps:
    - name: Check provisioned build tools
      working-directory: .
      run: |
        node --version
        pnpm --version
        rustup --version
        python3 -c "import yaml"
        command -v tini
    - name: Fetch exact source archive
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_COMMIT: ${{ forgejo.sha }}
        ARCHIVE_PROXY: ${{ vars.SOURCE_ARCHIVE_PROXY }}
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE"
        printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | \
          curl -q --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 180 --retry 2 --retry-delay 3 --retry-connrefused \
          --config - --proxy "$ARCHIVE_PROXY" --noproxy '' \
          --output "$RUNNER_TEMP/source.tar.gz" \
          "$SOURCE_SERVER/api/v1/repos/$SOURCE_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
        tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
    - name: Download build artifacts
      uses: https://data.forgejo.org/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
      with:
        path: release-assets
    - name: Merge checksums
      run: |
        sh release-assets/release-scripts/merge-release-checksums.sh release-assets
    - name: Record Forgejo build source
      env:
        SOURCE_COMMIT: ${{ forgejo.sha }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
      run: |
        python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        Path("release-assets/BUILD_INFO.json").write_text(json.dumps({"commit": os.environ["SOURCE_COMMIT"], "tag": os.environ["RELEASE_TAG"], "repository": os.environ["SOURCE_REPOSITORY"], "server": os.environ["SOURCE_SERVER"], "signed_attestation": False}, sort_keys=True) + "\n")
        PYTHON
        (cd release-assets && sha256sum BUILD_INFO.json >> SHA256SUMS.txt)
    - name: Stage and verify release assets
      run: |
        mkdir -p publish
        cp \
          release-assets/release-x86_64-unknown-linux-musl/nodelite-server-x86_64-unknown-linux-musl \
          release-assets/release-x86_64-unknown-linux-musl/nodelite-agent-x86_64-unknown-linux-musl \
          release-assets/release-x86_64-unknown-linux-musl/nodelite-updater-x86_64-unknown-linux-musl \
          release-assets/release-aarch64-unknown-linux-musl/nodelite-server-aarch64-unknown-linux-musl \
          release-assets/release-aarch64-unknown-linux-musl/nodelite-agent-aarch64-unknown-linux-musl \
          release-assets/release-aarch64-unknown-linux-musl/nodelite-updater-aarch64-unknown-linux-musl \
          release-assets/release-agent-macos/nodelite-agent-x86_64-apple-darwin \
          release-assets/release-agent-macos/nodelite-agent-aarch64-apple-darwin \
          release-assets/release-scripts/install-server.sh \
          release-assets/release-scripts/install-server-config.sh \
          release-assets/release-scripts/install-server-upgrade.sh \
          release-assets/release-scripts/install-agent.sh \
          release-assets/release-scripts/install-agent-signed.sh \
          release-assets/release-sbom/nodelite-proto.cdx.json \
          release-assets/release-sbom/nodelite-agent.cdx.json \
          release-assets/release-sbom/nodelite-server.cdx.json \
          release-assets/release-sbom/nodelite-updater.cdx.json \
          release-assets/release-sbom/THIRD_PARTY_NOTICES.md \
          release-assets/SHA256SUMS.txt \
          release-assets/BUILD_INFO.json \
          publish/
        cd publish
        sha256sum -c --strict SHA256SUMS.txt
        ls -1 | grep -vx SHA256SUMS.txt | sort > ../published.list
        awk '{print $2}' SHA256SUMS.txt | sort > ../manifest.list
        if ! diff -u ../published.list ../manifest.list; then
          echo "::error::SHA256SUMS.txt does not cover exactly the published assets"
          exit 1
        fi
    - name: Publish complete Forgejo draft
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        FORGEJO_SERVER: ${{ forgejo.server_url }}
        FORGEJO_REPOSITORY: ${{ forgejo.repository }}
        FORGEJO_COMMIT: ${{ forgejo.sha }}
      run: python3 scripts/publish-forgejo-release.py --directory publish --tag "$RELEASE_TAG"
    container:
      image: nodelite-ci:20261113-v2
    timeout-minutes: 120
  build-agent-macos:
    name: macOS Agent cross build (Intel and ARM64)
    runs-on: mainland
    container:
      image: nodelite-macos-cross:20261113-v1
    timeout-minutes: 30
    needs:
    - validate
    steps:
    - name: Fetch exact source archive
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_COMMIT: ${{ forgejo.sha }}
        ARCHIVE_PROXY: ${{ vars.SOURCE_ARCHIVE_PROXY }}
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE"
        printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | \
          curl -q --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 180 --retry 2 --retry-delay 3 --retry-connrefused \
          --config - --proxy "$ARCHIVE_PROXY" --noproxy '' \
          --output "$RUNNER_TEMP/source.tar.gz" \
          "$SOURCE_SERVER/api/v1/repos/$SOURCE_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
        tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
    - name: Cache macOS cross build
      uses: https://data.forgejo.org/actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092
      with:
        path: |
          /usr/local/cargo/registry
          /usr/local/cargo/git
          target
        key: nodelite-release-macos-cross-v1-${{ hashFiles('**/Cargo.lock') }}
    - name: Build and verify macOS Agent binaries
      run: NODELITE_BUILD_VERSION="${RELEASE_TAG#v}" bash scripts/ci/build-macos-agent.sh
    - name: Upload macOS Agent artifacts
      uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
      with:
        name: release-agent-macos
        path: dist/macos/
        if-no-files-found: error
        retention-days: 7
defaults:
  run:
    shell: bash
concurrency:
  group: nodelite-release-${{ forgejo.ref }}
  cancel-in-progress: false
