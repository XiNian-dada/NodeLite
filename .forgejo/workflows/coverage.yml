name: Coverage
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: {}
jobs:
  web-build:
    name: Build Web Assets
    runs-on: mainland
    defaults:
      run:
        working-directory: nodelite-server/web
    steps:
    - name: Check provisioned build tools
      working-directory: .
      run: |
        node --version
        pnpm --version
        rustup --version
        python3 -c "import yaml"
        command -v tini
    - name: Fetch exact source archive
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_COMMIT: ${{ forgejo.sha }}
        ARCHIVE_PROXY: ${{ vars.SOURCE_ARCHIVE_PROXY }}
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE"
        printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | \
          curl -q --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 180 \
          --config - --proxy "$ARCHIVE_PROXY" --noproxy '' \
          --output "$RUNNER_TEMP/source.tar.gz" \
          "$SOURCE_SERVER/api/v1/repos/$SOURCE_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
        tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build
      run: pnpm build
    - name: Upload web dist
      uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
      with:
        name: web-dist-coverage
        path: nodelite-server/web/dist
        retention-days: 1
    container:
      image: nodelite-ci:20261113-v1
    timeout-minutes: 90
  coverage:
    name: Test Coverage
    runs-on: mainland
    needs:
    - web-build
    steps:
    - name: Check provisioned build tools
      working-directory: .
      run: |
        node --version
        pnpm --version
        rustup --version
        python3 -c "import yaml"
        command -v tini
    - name: Fetch exact source archive
      env:
        FORGEJO_TOKEN: ${{ forgejo.token }}
        SOURCE_SERVER: ${{ forgejo.server_url }}
        SOURCE_REPOSITORY: ${{ forgejo.repository }}
        SOURCE_COMMIT: ${{ forgejo.sha }}
        ARCHIVE_PROXY: ${{ vars.SOURCE_ARCHIVE_PROXY }}
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE"
        printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | \
          curl -q --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 180 \
          --config - --proxy "$ARCHIVE_PROXY" --noproxy '' \
          --output "$RUNNER_TEMP/source.tar.gz" \
          "$SOURCE_SERVER/api/v1/repos/$SOURCE_REPOSITORY/archive/$SOURCE_COMMIT.tar.gz"
        tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
    - name: Download web dist
      uses: https://data.forgejo.org/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
      with:
        name: web-dist-coverage
        path: nodelite-server/web/dist
    - name: Set up Rust
      run: |
        rustup default 1.93.1
        rustup component add llvm-tools-preview
    - name: Cache Cargo dependencies and build outputs
      uses: https://data.forgejo.org/actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092
      with:
        path: |
          /usr/local/cargo/registry
          /usr/local/cargo/git
          target
          fuzz/target
        key: nodelite-coverage-coverage-native-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --version 0.9.1 --locked
    - name: Run coverage
      env:
        NODELITE_SKIP_WEB_BUILD: 1
        RUSTFLAGS: --cfg=tarpaulin
      run: |
        cargo llvm-cov --workspace --locked --no-report
        mkdir -p target/coverage
        cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml --fail-under-lines 75 --ignore-filename-regex 'nodelite-server/src/(load_test|test_support)\.rs'
        cargo llvm-cov report --html --output-dir target/coverage --ignore-filename-regex 'nodelite-server/src/(load_test|test_support)\.rs'
    - name: Upload HTML report as artifact
      if: always()
      uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
      with:
        name: coverage-report
        path: target/coverage/
        retention-days: 14
    container:
      image: nodelite-ci:20261113-v1
    timeout-minutes: 90
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  CI: 'true'
defaults:
  run:
    shell: bash
concurrency:
  group: nodelite-coverage-${{ forgejo.ref }}
  cancel-in-progress: true
