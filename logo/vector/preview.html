<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NodeLite · 透明矢量图标预览</title>
    <link rel="icon" href="nodelite-icon-light.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e9edf2; color: #253348; font: 15px/1.6 system-ui, sans-serif; }
      main { max-width: 1340px; margin: 0 auto; padding: 40px; }
      header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 24px; gap: 20px; }
      h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -.7px; }
      header p { margin: 4px 0 0; color: #64748b; }
      .badge { white-space: nowrap; background: #d7f0e4; color: #217650; padding: 7px 13px; border-radius: 30px; font-size: 12px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      figure { margin: 0; min-width: 0; }
      .surface { height: 400px; border-radius: 18px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .original { background: #101622; }
      .original img { width: 100%; height: 100%; object-fit: contain; }
      .light { background: #ffffff; }
      .dark { background: #101622; }
      .vector img { width: 78%; height: 82%; object-fit: contain; }
      figcaption { margin: 12px 0 0 2px; font-size: 14px; font-weight: 600; }
      figcaption span { display: block; margin-top: 3px; color: #64748b; font-size: 12px; font-weight: 400; }
      .details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; }
      .checker { --a: #f4f6f9; --b: #e1e6ee; border-radius: 18px; padding: 22px 26px; background: repeating-conic-gradient(var(--a) 0% 25%, var(--b) 0% 50%) 0 0 / 22px 22px; }
      .checker.dark { --a: #182233; --b: #202d41; color: #e7edf6; }
      .checker h2 { font-size: 13px; margin: 0 0 16px; font-weight: 550; }
      .sizes { display: flex; align-items: center; justify-content: space-around; height: 118px; }
      .sizes img { display: block; }
      footer { margin-top: 22px; font-size: 12px; color: #64748b; }
      @media (max-width: 760px) { main { padding: 24px; } header { display: block; } .badge { display: inline-block; margin-top: 12px; } .grid, .details { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>NodeLite · 矢量重绘</h1><p>保留原有造型，统一线条与几何结构。</p></div>
        <div class="badge">SVG 路径 · 透明背景 · 无字体依赖</div>
      </header>
      <section class="grid" aria-label="原图与矢量图对比">
        <figure>
          <div class="surface original"><img src="../file_00000000ebe071f599ec01a03b647bb3.png" alt="原始深色位图"></div>
          <figcaption>原始图标<span>PNG · 带背景与纹理</span></figcaption>
        </figure>
        <figure>
          <div class="surface vector light"><img src="nodelite-light.svg" alt="浅色背景上的透明矢量标志"></div>
          <figcaption>浅色背景版<span>纯矢量 · 提升浅色背景上的线条对比度</span></figcaption>
        </figure>
        <figure>
          <div class="surface vector dark"><img src="nodelite-dark.svg" alt="深色背景上的透明矢量标志"></div>
          <figcaption>深色背景版<span>纯矢量 · 保留绿色与蓝色节点</span></figcaption>
        </figure>
      </section>
      <section class="details" aria-label="透明背景与不同尺寸预览">
        <div class="checker">
          <h2>透明底图标 / 浅色场景</h2>
          <div class="sizes"><img src="nodelite-icon-light.svg" width="112" height="112" alt="112 像素图标"><img src="nodelite-icon-light.svg" width="64" height="64" alt="64 像素图标"><img src="nodelite-icon-light.svg" width="32" height="32" alt="32 像素图标"></div>
        </div>
        <div class="checker dark">
          <h2>透明底图标 / 深色场景</h2>
          <div class="sizes"><img src="nodelite-icon-dark.svg" width="112" height="112" alt="112 像素图标"><img src="nodelite-icon-dark.svg" width="64" height="64" alt="64 像素图标"><img src="nodelite-icon-dark.svg" width="32" height="32" alt="32 像素图标"></div>
        </div>
      </section>
      <footer>预览中的白色、深色及棋盘格均为展示背景，SVG 文件本身没有底色。文字也是路径，可直接用于设计工具或网页。</footer>
    </main>
  </body>
</html>
